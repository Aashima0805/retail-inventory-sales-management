server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: retail-inventory-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Free-tier optimization for Supabase (connection pool limit)
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      # Strictly validate schema against Flyway migrations
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

# Application Security and JWT configuration
app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLWRlZmF1bHQtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seS1kb250LXVzZS1pbi1wcm9kdWN0aW9u}
    expiration-ms: ${JWT_EXPIRATION_MS:1800000} # 30 minutes
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Swagger / OpenAPI documentation
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
